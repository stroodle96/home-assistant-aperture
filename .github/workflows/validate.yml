name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check custom_components tests scripts
      - run: python -m ruff format --check custom_components tests scripts
      - name: Real Home Assistant integration test
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work:ro" --workdir /work
          --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
          tests/ha_smoke.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: aperture
          path: dist/*.zip
